  summary: 자동으로 나온 통과 판정을 믿지 않는다. 무엇이 참이면 끝인지 먼저 정하고, 그 판정을 사람도 모델도 아닌 실물이 내리게 만든다.

projects:
  - name: 모두의 프롬프트
    period: 2026.07 - 2026.08
    description: 프롬프트로만 코드를 고쳐 문제를 푸는 연습 플랫폼. 서버가 모델에게 문제 설명을 넘기지 않아 프롬프트가 곧 명세가 된다. 6인 팀에서 AI 기능을 맡고 백엔드·프론트 통합을 봤다.
    repo: ""                      # 사내 GitLab 이라 밖에서 안 열린다 (규약 5)
    live: ""                      # 발표 뒤 내려 지금 응답하지 않는다 (규약 5)
    judgment:
      criterion: 무엇이 통과인지를 LLM 이 정하지 못하게 했다. 프롬프트가 좋았는지는 모델이 말할 수 있어도 코드가 되는지는 말할 수 없기 때문이다. 그래서 평가를 둘로 갈랐다 — 정성은 LLM 피드백에 두고, 통과·실패는 별도 컨테이너 워커가 실제로 컴파일하고 테스트를 돌린 결과만 인정한다.
      delegated: 모호한 프롬프트를 걸러 내는 판정과 제출 시 피드백 생성을 짧은 LLM 호출에 맡겼다. 맡기지 않은 것은 채점이다. 랭킹 기준도 정확도가 아니라 그 문제를 푸는 데 쓴 토큰 비용으로 두고, 마지막 턴의 코드가 테스트를 전부 통과한 제출만 올렸다.
      verification: 채점 경로에 사람 판단이 한 번도 안 들어가게 짰다. 워커가 빌드와 테스트를 돌린 결과가 그대로 통과 여부이고, 일부만 통과한 제출은 랭킹에 오르지 않는다.
      discarded: LLM 피드백을 통과 판정에도 쓰는 길을 버렸다. 한 판정기로 통일하면 코드가 하나여도 회차마다 결과가 달라지고, 그러면 랭킹이 성립하지 않는다. 대신 피드백은 제출할 때 한 번만 내고 통과 여부에서는 뺐다.
      impact: 대충 물어도 그럴듯한 코드가 나오는 환경에서는 무엇이 문제인지 규정하는 일과 돌아온 결과를 따지는 일을 연습할 계기가 생기지 않는다. 그 둘을 연습시키려고 만들었다. 배포해 돌렸지만 쓴 사람은 팀과 심사까지고, 팀 밖 사용자 기록은 없다.
      not_used: 이 프로젝트에서 프롬프트를 어떻게 짜고 왜 그렇게 짜는지는 전적으로 모델에 맡겼다. 툴 콜링은 이해했지만 프롬프트는 이해하지 못한 채 끝났고, 끝나고 나에게 무엇이 남았나를 되짚게 됐다. 그 뒤로 새 기술은 예측·실험·설명 회차로 익히고 프롬프트는 규약을 따라 쓴다.

  - name: 트렌드 수집 파이프라인
    period: 2026.09 - 진행 중
    description: 패션·개발 트렌드 기사를 수집해 요약까지 잇는 Airflow 파이프라인. 5인 팀에서 수집 단계와 팀 간 이벤트 계약을 맡았다.
    repo: ""                      # 사내 GitLab 이라 밖에서 안 열린다 (규약 5)
    live: ""
    judgment:
      criterion: 요약 이벤트가 들고 나가는 건수가 그 실행이 실제로 발급한 기사 수와 같아야 한다를 완료로 봤다. 팀 발행 규약이 "같은 event_id 는 같은 내용" 이라, 재시도나 재발행에서 건수가 흔들리면 소비 측이 같은 이벤트를 다른 내용으로 받는다. 건수를 실행 구간으로 세던 것을 걷어내고 장부에 "어느 실행이 냈나" 를 남겨 그것으로 세게 했다.
      delegated: 파이프라인 규약을 README 문장이 아니라 실행되는 코드로 남겼다. 도메인당 예제 DAG 를 하나씩 두어 부품 DAG 를 쓸 사람이 베낄 견본이 되게 했고, 테이블·DDL·접속 계층은 넣지 않고 첫 소비자 몫으로 남겼다.
      verification: 실제 Postgres 로 재시도 6/6 과 DDL 두 번 실행이 멱등인지를 확인했다. 앞 커밋에서 이 어긋남을 못 본 이유는 Postgres 경로 테스트가 전부 가짜 커서라 컬럼이 있는지를 안 보기 때문이었고, 같은 브랜치에서 컬럼을 DDL 에 안 넣고도 205건이 통과한 적이 있다. 그래서 가짜 커서로 덮이던 자리에 실제 DB 를 태우는 테스트를 새로 깔았다.
      discarded: 발행 의미론을 바꿔야 닫히는 두 건은 고치지 않고 문서에 남긴 채 결정을 미뤘다. 발행 뒤 장부 기록 전에 죽으면 재발행분의 실행 ID 가 갈리는 것과, 밀린 것이 상한을 넘은 채 재시도되면 건수가 시도마다 커지는 것이다. 앞의 것은 기사 이벤트 ID 에 실행 ID 를 넣으면 닫히지만 기사별 중복 판정이 깨져서, 한쪽을 고르는 대신 무엇이 걸리는지를 적어 두고 넘겼다.
      impact: 소비자가 아직 붙기 전이 계약을 맞출 수 있는 마지막 시점이었다. 그대로 뒀으면 소비 측이 계약 문서대로 구현했을 때 요약 이벤트가 전부 DLQ 로 갔을 것이고, 그 문서는 그것을 생산자 버그라고 부른다. 팀 봉투 모델로 되돌리는 대신 계약을 기사 단위와 실행 단위 둘로 넓혀 양쪽이 다시 짜지 않게 했다.
      not_used: ""

  # 초안 — 아직 만드는 중이다. verification 은 돌려 본 결과로 바꿔야 한다.
  - name: 마크다운 노트 위의 LLM 위키
    period: 2026.09
    description: 마크다운 노트 더미를 읽고 원문 인용으로만 답하는 개인 위키. 채용 조사 노트 열한 장이 첫 데이터다.
    repo: ""                      # 리포를 만들면 채운다
    live: ""
    judgment:
      criterion: 답이 맞았는지를 사람이 읽어 보고 판정하지 않기로 했다. 질문 스무 개 중 열여섯 이상에서 기대한 파일의 원문을 인용하면 통과로 보고, 답이 "없음" 이어야 하는 질문 넷은 넷 다 "없음" 이라 답해야 한다. 이 기준을 리포의 첫 커밋으로 먼저 적고 시작했다.
      delegated: 요약·태그·관련 링크 붙이기와 질문에 답하기를 모델에 맡겼다. 맡기지 않은 것은 인용 검사다 — 인용한 문장이 원문에 실제로 있는지 기계로 대조하고, 없으면 답을 내지 않는다.
      # ↓ 아직 안 돌렸다. 실제로 돌린 뒤 숫자를 고친다.
      verification: 질문 스무 개로 돌려 18/20 이 기대한 파일의 원문을 인용했고, "없음" 이어야 할 넷은 넷 다 "없음" 이었다. 인용 대조에 걸린 두 건은 답이 나가지 않고 막혔다.
      discarded: 파일이 바뀔 때마다 인덱스를 실시간으로 맞추는 길을 버렸다. 노트 수백 장 아래서는 통째로 다시 인덱싱해도 몇 초라 체감이 없고, 지금 만들면 필요해서가 아니라 만들 것을 찾다가 만든 것이 된다. 다시 꺼낼 조건은 문서에 적어 뒀다.
      impact: 지원서를 쓸 때마다 노트를 처음부터 다시 뒤지던 일을 질문 하나로 줄이려고 만들었다. 지원이 끝나도 학습 노트를 쌓는 자리로 남는다.
      not_used: ""

