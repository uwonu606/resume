    problem: 왜 그 선택을 했는지가 코드에 안 남아 나중에 아무도 되짚지 못한다.
    device: 작업을 이슈로 올리고 이슈 단위로 브랜치를 딴다. PR 에는 이 작업을 왜 했고 어떤 선택지가 있었고 왜 그것을 골랐는지를 적고, 테스트가 통과하는 상태로만 올린 뒤 변경 파일의 테스트 코드를 읽어 무엇을 했는지 확인한다.

