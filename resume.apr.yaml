# 에이피알 Product Engineer(26 신입채용) 지원용. 범용 resume.yaml 에서 갈라 나온 가지다.
# 이 가지에서 바꾼 것:
#   judgment 여섯 칸이 claim(주장) / why(근거) 두 층으로 갈린다. 범용은 아직 한 덩어리 문자열이고
#   렌더러가 둘 다 받는다 (docs/design.apr.md#층).
#   프로젝트마다 flow 칸으로 판정 흐름도를 그리고, caption(주장)과 why(근거)를 그 밑에 둔다.
#   판단 칸은 그림이 못 담는 것만 프로젝트마다 골라 남기고, 칸마다 ask 로 질문을 단다.
#   프로젝트에 stack(쓴 기술)이 붙고, skills 는 묶음마다 깊이를 한 줄로 말한다.
#   operation 칸을 빼고 impact 칸을 더했다. 교육(training)과 학력(education)을 갈랐다.
#   writing(쓴 글) 섹션을 뺐다 — 실린 셋이 전부 아래 environment 의 리포와 같은 물건이었다.
# 근거 노트: job-prep-notes/career/companies/apr/roles/product-engineer-newcomer/role.md
# 값에 # 이 들어가면 따옴표로 감싼다. 안 그러면 YAML 이 주석으로 먹는다.

# src/style.apr.css 를 쓴다. 비우면 기본 모양(src/style.css)으로 떨어진다.
theme: apr

basics:
  name: 유원우
  title: 백엔드 · 데이터 파이프라인
  email: biddan606@gmail.com
  phone: ""                       # 공개 리포라 적지 않는다. 지원 폼에만 쓴다.
  location: ""
  photo: ""                       # 첫 화면에서 가장 강한 것이 얼굴이 되면 안 된다 (docs/design.apr.md#머리글)
  # 이 문서가 어디에 내는 것인지. 로고가 회사를, 이 줄이 자리를 맡는다.
  target: 에이피알 2026 신입 Product Engineer 지원
  mark: assets/apr/apr-logo-white.png
  links:
    - label: GitHub
      url: https://github.com/uwonu606
  # 아래 항목 최소 둘로 증명돼야 한다. 지금은 「모두의 프롬프트」와 「트렌드 수집 파이프라인」이 받친다.
  summary: 자동으로 나온 통과 판정을 믿지 않는다. 무엇이 참이면 끝인지 먼저 정하고, 그 판정을 사람도 모델도 아닌 실물이 내리게 만든다.

# 프로젝트 하나가 인쇄에서 한 장을 갖는다 (docs/design.apr.md#길이).
# 덩어리 순서: 설명 → 기술 → 흐름도 → 캡션과 그 근거(why) → 그림이 못 담는 판단 칸.
# 판단 칸은 프로젝트마다 다르다. 그림이 이미 말하는 칸은 빼고, 남긴 칸마다 ask 로 그 그림에서
# 이어지는 질문을 단다. 라벨이 곧 "이 칸이 왜 여기 있나" 의 답이다 (docs/design.apr.md#층).
projects:
  - name: 모두의 프롬프트
    period: 2026.07 - 2026.08
    description: 프롬프트로만 코드를 고쳐 문제를 푸는 연습 플랫폼. 서버가 모델에게 문제 설명을 넘기지 않아 프롬프트가 곧 명세가 된다. 6인 팀에서 AI 기능을 맡고 백엔드·프론트 통합을 봤다.
    stack: [Java, Spring Boot, JUnit, TypeScript, React]
    repo: ""                      # 사내 GitLab 이라 밖에서 안 열린다 (규약 5)
    live: ""                      # 발표 뒤 내려 지금 응답하지 않는다 (규약 5)
    # by 는 그 단계를 누가 하나다 — llm 은 윤곽선 상자, machine 은 채운 상자.
    # verdict 는 판정이 실제로 내려지는 자리이고 거기에만 빨강이 찍힌다.
    # caption 은 그림의 주장, why 는 그 주장의 근거다. 둘이 판단 칸과 같은 두 층이다.
    flow:
      caption: 통과 판정에 닿는 선은 컨테이너 하나뿐이다
      why: 프롬프트가 좋았는지는 모델이 말할 수 있어도 코드가 되는지는 말할 수 없다. 그래서 평가를 둘로 갈랐다. 정성은 LLM 피드백에 두고, 통과·실패는 별도 컨테이너 워커가 실제로 컴파일하고 테스트를 돌린 결과만 인정한다. LLM 에 맡긴 것은 모호한 프롬프트를 걸러 내는 판정과 제출 시 피드백 생성뿐이고, 채점 경로에는 사람도 모델도 들어가지 않는다. 랭킹 기준은 정확도가 아니라 그 문제를 푸는 데 쓴 토큰 비용이고, 마지막 턴의 코드가 테스트를 전부 통과한 제출만 오른다.
      steps:
        - 프롬프트
        - { step: 모호성 판정, by: llm }
        - 코드 생성
        - 제출
        - branch:
            - [{ step: 피드백, by: llm }, { step: 정성 평가, note: 랭킹 밖 }]
            - [{ step: 빌드 + 테스트, by: machine, verdict: true }, { step: 랭킹, note: "순위 = 토큰 비용" }]
    judgment:
      discarded:
        ask: 피드백을 통과 판정에도 쓰면 왜 안 되나
        claim: LLM 피드백을 통과 판정에도 쓰는 길을 버렸다
        why: 한 판정기로 통일하면 코드가 하나여도 회차마다 결과가 달라지고, 그러면 랭킹이 성립하지 않는다. 대신 피드백은 제출할 때 한 번만 내고 통과 여부에서는 뺐다.
      impact:
        ask: 이것으로 무엇을 연습시키려 했나
        claim: 문제를 규정하는 일과 돌아온 결과를 따지는 일을 연습시키려고 만들었다
        why: 대충 물어도 그럴듯한 코드가 나오는 환경에서는 그 둘을 연습할 계기가 생기지 않는다. 배포해 돌렸지만 쓴 사람은 팀과 심사까지고, 팀 밖 사용자 기록은 없다.
      not_used:
        ask: 모델에 맡기고 나에게 남은 것은
        claim: 프롬프트를 어떻게 짜는지는 전적으로 모델에 맡겼고, 그것이 나에게 남긴 것이 없었다
        why: 툴 콜링은 이해했지만 프롬프트는 이해하지 못한 채 끝났고, 끝나고 나에게 무엇이 남았나를 되짚게 됐다. 그 뒤로 새 기술은 예측·실험·설명 회차로 익히고 프롬프트는 규약을 따라 쓴다.

  - name: 트렌드 수집 파이프라인
    period: 2026.09 - 진행 중
    description: 패션·개발 트렌드 기사를 수집해 요약까지 잇는 Airflow 파이프라인. 5인 팀에서 수집 단계와 팀 간 이벤트 계약을 맡았다.
    stack: [Python, Airflow, pytest, PostgreSQL, Docker Compose]
    repo: ""                      # 사내 GitLab 이라 밖에서 안 열린다 (규약 5)
    live: ""
    # retry 는 그 단계 위로 되돌아오는 고리를 그린다. 이 그림의 핵심이 재시도에서 건수가 안 흔들리는 것이다.
    flow:
      caption: 건수를 세는 자리를 실행 구간에서 장부로 옮겼다
      why: 요약 이벤트가 들고 나가는 건수가 그 실행이 실제로 발급한 기사 수와 같아야 완료다. 팀 발행 규약이 "같은 event_id 는 같은 내용" 이라, 재시도나 재발행에서 건수가 흔들리면 소비 측이 같은 이벤트를 다른 내용으로 받는다. 실행 구간으로 세던 것을 걷어내고, 장부에 어느 실행이 냈나를 남겨 그것으로 세게 했다. 파이프라인 규약은 README 문장이 아니라 도메인당 예제 DAG 하나로 남겨 부품 DAG 를 쓸 사람이 베낄 견본이 되게 했고, 테이블·DDL·접속 계층은 첫 소비자 몫으로 남겼다.
      steps:
        - DAG 실행
        - 기사 수집
        - { step: 기사 이벤트 발행, retry: true }
        - { step: 장부에 실행 ID 기록, by: machine }
        - { step: 건수 대조, by: machine, verdict: true }
    judgment:
      verification:
        ask: 장부로 세는 것이 맞는지 어떻게 확인했나
        claim: 가짜 커서로 덮이던 자리에 실제 DB 를 태우는 테스트를 새로 깔았다
        why: 실제 Postgres 로 재시도 6/6 과 DDL 두 번 실행이 멱등인지를 확인했다. 앞 커밋에서 이 어긋남을 못 본 이유는 Postgres 경로 테스트가 전부 가짜 커서라 컬럼이 있는지를 안 보기 때문이었고, 같은 브랜치에서 컬럼을 DDL 에 안 넣고도 205건이 통과한 적이 있다.
      discarded:
        ask: 안 고친 것은 무엇이고 왜 미뤘나
        claim: 발행 의미론을 바꿔야 닫히는 두 건은 고치지 않고 문서에 남긴 채 결정을 미뤘다
        why: 발행 뒤 장부 기록 전에 죽으면 재발행분의 실행 ID 가 갈리는 것과, 밀린 것이 상한을 넘은 채 재시도되면 건수가 시도마다 커지는 것이다. 앞의 것은 기사 이벤트 ID 에 실행 ID 를 넣으면 닫히지만 기사별 중복 판정이 깨져서, 한쪽을 고르는 대신 무엇이 걸리는지를 적어 두고 넘겼다.
      impact:
        ask: 왜 지금 고쳐야 했나
        claim: 소비자가 아직 붙기 전이 계약을 맞출 수 있는 마지막 시점이었다
        why: 그대로 뒀으면 소비 측이 계약 문서대로 구현했을 때 요약 이벤트가 전부 DLQ 로 갔을 것이고, 그 문서는 그것을 생산자 버그라고 부른다. 팀 봉투 모델로 되돌리는 대신 계약을 기사 단위와 실행 단위 둘로 넓혀 양쪽이 다시 짜지 않게 했다.

  - name: 마크다운 노트 위의 LLM 위키
    period: 2026.09 - 진행 중
    description: 마크다운 노트 더미를 읽고 원문 인용으로만 답하는 개인 위키. 채용 조사 노트 열한 장이 첫 데이터다.
    stack: [Python]
    repo: ""                      # 리포를 만들면 채운다
    live: ""
    flow:
      caption: 인용이 원문에 없으면 답이 나가지 않는다
      why: 답이 맞았는지를 사람이 읽어 보고 판정하지 않는다. 요약·태그·답 생성은 모델에 맡기되, 인용한 문장이 원문에 실제로 있는지는 기계가 대조하고 없으면 답을 내지 않는다. 맡긴 쪽이 틀려도 맡기지 않은 쪽이 막는 구조다. 통과 기준은 코드보다 먼저 리포 첫 커밋에 적었다. 질문 스무 개 중 열여섯 이상에서 기대한 파일의 원문을 인용하고, 답이 "없음" 이어야 하는 넷은 넷 다 "없음" 이라 답해야 한다.
      steps:
        - 질문
        - { step: 노트 검색, by: machine }
        - { step: 답 생성, by: llm }
        - { step: 인용 대조, by: machine, verdict: true }
        - branch:
            - [{ step: 원문에 있음, note: 답이 나간다 }]
            - [{ step: 원문에 없음, note: 막힌다 }]
    judgment:
      # 이 칸이 비어 있는 것이 지금 상태다. 돌린 뒤에 결과로 바꾼다.
      verification:
        ask: 그 기준을 실제로 돌렸나
        claim: 아직 안 돌렸다 — 기준만 먼저 박아 두고 시작한 상태다
        why: 위 스무 개를 돌린 결과가 나오면 이 칸을 그 숫자로 바꾼다. 지금 적을 수 있는 것은 무엇이 통과인지를 코드보다 먼저 리포 첫 커밋에 적었다는 것까지다.
      discarded:
        ask: 안 만든 것은 무엇인가
        claim: 파일이 바뀔 때마다 인덱스를 실시간으로 맞추는 길을 버렸다
        why: 노트 수백 장 아래서는 통째로 다시 인덱싱해도 몇 초라 체감이 없고, 지금 만들면 필요해서가 아니라 만들 것을 찾다가 만든 것이 된다. 다시 꺼낼 조건은 문서에 적어 뒀다.
      impact:
        ask: 무엇을 줄이려고 만들었나
        claim: 지원서를 쓸 때마다 노트를 처음부터 다시 뒤지던 일을 질문 하나로 줄이려고 만들었다
        why: 지원이 끝나도 학습 노트를 쌓는 자리로 남는다.

experience: []

# 에이전트가 직접 소비하는 것. 반복되던 문제와 넣은 장치를 못 적으면 항목이 아니다.
environment:
  - name: 새 기술을 익히는 스킬
    repo: https://github.com/uwonu606/lab-notes
    problem: 에이전트가 대신 쓰면 진행은 빠른데 무엇이 어떻게 도는지 모른 채 지나간다. 앞 팀 프로젝트에서 프롬프트를 이해 못 한 채 끝낸 것이 그 결과였다.
    device: 예측 → 실험 → 설명 회차로 익히고 회차마다 노트를 남기는 스킬을 만들어 쓴다. 먼저 어떻게 돌지 적고 실험으로 확인하므로, 예측이 틀린 자리가 그날 실제로 배운 것이 된다.
  - name: 직접 만든 스킬 모음과 설치 스크립트
    repo: https://github.com/uwonu606/claude-skills
    problem: 스킬이 기계마다 흩어지고, 지운 스킬의 링크가 남아 옛 이름으로 발동을 다툰다.
    device: 스킬 다섯을 한 리포에 두고 install.sh 가 symlink 로 깐다. 저장소에서 고치면 다음 세션에 바로 반영되고, 지워진 스킬의 링크는 설치할 때 같이 걷는다.
  - name: 이슈 단위 작업과 PR 규약
    repo: ""
    problem: 왜 그 선택을 했는지가 코드에 안 남아 나중에 아무도 되짚지 못한다.
    device: 작업을 이슈로 올리고 이슈 단위로 브랜치를 딴다. PR 에는 이 작업을 왜 했고 어떤 선택지가 있었고 왜 그것을 골랐는지를 적고, 테스트가 통과하는 상태로만 올린 뒤 변경 파일의 테스트 코드를 읽어 무엇을 했는지 확인한다.

# 프로젝트의 stack 줄이 "무엇으로 만들었나" 를, 이 섹션이 "그것을 어디까지 아나" 를 말한다.
# 기술마다가 아니라 묶음마다 한 줄이다. 열한 개를 한 줄씩 쓰면 한 장이 는다.
# 「읽고 고칠 수 있는 것」 줄은 뺐다 — 써 본 적 없는 이름의 나열이라 이 섹션의 주장(어디까지 아나)을 받치지 못했다.
skills:
  groups:
    - names: [Java, Spring Boot, JUnit]
      depth: 모두의 프롬프트에서 모호성 판정·피드백 호출 같은 AI 기능과 백엔드·프론트 통합을 이걸로 짰다.
    - names: [Python, Airflow, pytest, PostgreSQL]
      depth: 트렌드 파이프라인의 수집 DAG 와 이벤트 계약을 짰고, 가짜 커서 대신 실제 Postgres 를 태우는 테스트로 재시도와 DDL 멱등을 확인했다.
    - names: [TypeScript, React]
      depth: 모두의 프롬프트에서 백엔드와 잇는 화면을 맡아 썼다.
    - names: [Docker Compose, Git]
      depth: 컨테이너 워커와 파이프라인을 로컬에서 띄우는 데 쓴다. 작업은 이슈 단위 브랜치와 PR 로 낸다.

