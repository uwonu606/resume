    device: 스킬 다섯을 한 리포에 두고 install.sh 가 symlink 로 깐다. 저장소에서 고치면 다음 세션에 바로 반영되고, 지워진 스킬의 링크는 설치할 때 같이 걷는다.
  - name: 이슈 단위 작업과 PR 규약
